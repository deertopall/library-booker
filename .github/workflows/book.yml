name: Library booking
# Normal nightly runs are titled "nightly"; manual test runs show their date.
# Nightly runs are started at 23:50 Rome by cron-job.org (API dispatch), with a
# backup check at 00:03. GitHub's own schedule was removed: it fired hours late.
run-name: ${{ inputs.date && format('test {0}', inputs.date) || 'nightly' }}

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Target date YYYY-MM-DD (leave empty for normal run)"
        required: false
      start:
        description: "Start time HH:MM (optional, for tests)"
        required: false
      end:
        description: "End time HH:MM (optional, for tests)"
        required: false
      dry_run:
        description: "Dry run (never books)"
        type: boolean
        default: true

# Runs queue up instead of overlapping.
concurrency:
  group: library-booking
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Skip if already handled tonight
        id: guard
        if: inputs.date == '' || inputs.date == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-5 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/book.yml/runs?per_page=30" \
              --jq "[.workflow_runs[] | select(.display_title == \"nightly\") | select(.id < ${{ github.run_id }}) | select(.run_started_at >= \"$since\") | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\")] | length")
          echo "earlier nightly runs tonight: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - name: Run booker
        if: steps.guard.outputs.skip != 'true'
        env:
          LB_EMAIL: ${{ secrets.LB_EMAIL }}
          LB_MATRICOLA: ${{ secrets.LB_MATRICOLA }}
          LB_DEVICE_TOKEN: ${{ secrets.LB_DEVICE_TOKEN }}
          LB_NTFY_TOPIC: ${{ secrets.LB_NTFY_TOPIC }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }} --no-wait"
            [ -n "${{ inputs.start }}" ] && ARGS="$ARGS --start ${{ inputs.start }}"
            [ -n "${{ inputs.end }}" ] && ARGS="$ARGS --end ${{ inputs.end }}"
            # dry runs are tests: never sit waiting for midnight
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run --no-wait"
          fi
          python3 booker.py $ARGS
